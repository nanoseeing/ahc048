[general]
version = "0.2.0"

[problem]
problem_name = "AHC048"
objective = "Min"
score_regex = '(?m)^\s*Score\s*=\s*(?P<score>\d+)\s*$'

[test]
start_seed = 0
end_seed = 100
threads = 0
out_dir = "./pahcer"

# ==============================
#         COMPILE STEPS
# ==============================

# Compile the user's program
[[test.compile_steps]]
args = [
    "-std=c++20",
    "-O2",
    "main.cpp",
    "-DONLINE_JUDGE",
    "-DATCODER",
    "-I/home/nanoseeing/AtCoder/ac-library-master",
    "-I/home/nanoseeing/AtCoder/cpp-dump",
    "-I/usr/include/boost/lib",
    "-I/home/nanoseeing/AtCoder/eigen-3.4.0",
]

program = "g++"
# ==============================
#           TEST STEPS
# ==============================

# Run the user's program
[[test.test_steps]]
program = "./a.out"
args = []
stdin = "./tools/in/{SEED04}.txt"
stdout = "./tools/out/{SEED04}.txt"
stderr = "./tools/err/{SEED04}.txt"
measure_time = true

# Run the visualizer to calculate the score
[[test.test_steps]]
program = "cargo"
args = [
    "run",
    "--bin",
    "vis",
    "--release",
    "./in/{SEED04}.txt",
    "./out/{SEED04}.txt",
]
current_dir = "./tools"
measure_time = false
